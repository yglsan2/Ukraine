<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hors ligne - Lumières d'Ukraine</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0057b8 0%, #ffdd00 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .offline-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 3rem;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            margin: 1rem;
        }
        .offline-icon {
            font-size: 4rem;
            color: #0057b8;
            margin-bottom: 1rem;
        }
        .btn-retry {
            background: linear-gradient(45deg, #0057b8, #ffdd00);
            border: none;
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .btn-retry:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">
            <i class="fas fa-wifi-slash"></i>
        </div>
        <h1 class="mb-3">Vous êtes hors ligne</h1>
        <p class="text-muted mb-4">
            Il semble que vous n'ayez pas de connexion internet. 
            Certaines fonctionnalités de Lumières d'Ukraine peuvent ne pas être disponibles.
        </p>
        <div class="d-grid gap-2">
            <button class="btn btn-retry" onclick="window.location.reload()">
                <i class="fas fa-redo"></i> Réessayer
            </button>
        </div>
        <div class="mt-4">
            <small class="text-muted">
                <i class="fas fa-info-circle"></i>
                L'application fonctionne hors ligne pour les fonctionnalités de base
            </small>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
